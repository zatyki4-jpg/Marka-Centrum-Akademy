<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c8873a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DakPro" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <title>DakPro Academy</title>
</head>
<body>
<div id="app">

  <div class="topbar" id="topbar">
    <div class="topbar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22" fill="none" stroke="#1a0e00" stroke-width="2"/></svg>
      </div>
      <div>
        <div class="logo-title">DakPro Academy</div>
        <div class="logo-sub">Dakdekkers opleiding</div>
      </div>
    </div>
    <button id="topbar-email" class="topbar-email" onclick="switchTab('profile')">Inloggen</button>
  </div>

  <!-- LOGIN -->
  <div class="screen active" id="screen-login">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88vh;padding:32px 24px;">
      <div style="text-align:center;margin-bottom:36px;">
        <div style="width:72px;height:72px;background:var(--accent);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <svg viewBox="0 0 24 24" style="width:38px;height:38px;fill:#1a0e00;"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22" fill="none" stroke="#1a0e00" stroke-width="2"/></svg>
        </div>
        <h1 style="font-family:Georgia,serif;font-size:26px;color:var(--text);margin-bottom:6px;">DakPro Academy</h1>
        <p style="font-size:13px;color:var(--text3);">Professionele dakdekkersopleiding</p>
      </div>
      <div style="width:100%;max-width:340px;">
        <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:6px;">E-mailadres</label>
        <input type="email" id="login-email" placeholder="jouw@email.nl"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 14px;color:var(--text);font-size:15px;font-family:var(--sans);margin-bottom:14px;outline:none;"
          onkeydown="if(event.key==='Enter')handleLogin()" />
        <button class="btn btn-primary btn-full" onclick="handleLogin()">Inloggen / Registreren</button>
        <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:12px;">Demo: gebruik demo@dakpro.nl</div>
      </div>
    </div>
  </div>

  <!-- CATALOG -->
  <div class="screen" id="screen-catalog">
    <div class="scroll-content" id="catalog-list">
      <div class="loading"><div class="spinner"></div><div class="loading-text">Laden...</div></div>
    </div>
  </div>

  <!-- COURSE -->
  <div class="screen" id="screen-course">
    <div class="content-header">
      <button class="back-btn" onclick="goHome()">← Terug</button>
      <div class="content-course-name">Cursus inhoud</div>
      <div class="content-title" id="course-header-title">Cursus</div>
    </div>
    <div class="stage-list scroll-content" id="stage-list"></div>
  </div>

  <!-- LESSON -->
  <div class="screen" id="screen-lesson">
    <div class="content-header">
      <button class="back-btn" onclick="backToStages()">← Terug naar module</button>
      <div class="content-course-name">Les</div>
      <div class="content-title" id="lesson-title">Les</div>
    </div>
    <div class="scroll-content" id="lesson-content"></div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="scroll-content" id="result-screen"></div>
  </div>

  <!-- PROFILE -->
  <div class="screen" id="screen-profile">
    <div class="scroll-content" id="profile-screen"></div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" id="tab-catalog" onclick="switchTab('catalog')">
      <div class="tab-icon">🏠</div>
      <div class="tab-label">Cursussen</div>
      <div class="tab-indicator"></div>
    </div>
    <div class="tab-item" id="tab-profile" onclick="switchTab('profile')">
      <div class="tab-icon">👤</div>
      <div class="tab-label">Profiel</div>
      <div class="tab-indicator"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
